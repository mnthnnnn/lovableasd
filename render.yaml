# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: mnthnnnn-keys
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false          # You set this manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: mnthnnnn-db
          property: connectionString

databases:
  - name: mnthnnnn-db
    databaseName: mnthnnnn_keys
    user: mnthnnnn_admin
    plan: free               # Render free PostgreSQL (90 days, then upgrade)
